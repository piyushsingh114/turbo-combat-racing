<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0220"/>
      <stop offset="0.65" stop-color="#2a0a4a"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb400"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="600" cy="285" r="115" fill="url(#sun)"/>
  <g fill="#2a0a4a">
    <rect x="470" y="250" width="260" height="4"/>
    <rect x="470" y="268" width="260" height="6"/>
    <rect x="470" y="288" width="260" height="8"/>
  </g>

  <!-- ground and perspective grid -->
  <rect y="300" width="1200" height="200" fill="#0a0418"/>
  <g stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="600" y1="300" x2="-600" y2="500"/><line x1="600" y1="300" x2="-300" y2="500"/>
    <line x1="600" y1="300" x2="0" y2="500"/><line x1="600" y1="300" x2="300" y2="500"/>
    <line x1="600" y1="300" x2="900" y2="500"/><line x1="600" y1="300" x2="1200" y2="500"/>
    <line x1="600" y1="300" x2="1500" y2="500"/><line x1="600" y1="300" x2="1800" y2="500"/>
    <line x1="0" y1="312" x2="1200" y2="312"/><line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="355" x2="1200" y2="355"/><line x1="0" y1="392" x2="1200" y2="392"/>
    <line x1="0" y1="445" x2="1200" y2="445"/>
  </g>

  <!-- road -->
  <polygon points="560,300 640,300 1010,500 190,500" fill="#14122a"/>
  <g filter="url(#glow)" stroke-width="4">
    <line x1="560" y1="300" x2="190" y2="500" stroke="#00f0ff"/>
    <line x1="640" y1="300" x2="1010" y2="500" stroke="#ff2bd6"/>
  </g>
  <line x1="600" y1="300" x2="600" y2="500" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="14 18"/>

  <!-- laser shots -->
  <g filter="url(#glow)" stroke-width="4" stroke-linecap="round">
    <line x1="590" y1="395" x2="618" y2="345" stroke="#00f0ff"/>
    <line x1="612" y1="400" x2="632" y2="355" stroke="#00f0ff"/>
  </g>

  <!-- rival car (far) -->
  <g transform="translate(640 340) scale(0.38)" filter="url(#glow)">
    <rect x="-70" y="-30" width="140" height="40" rx="14" fill="#0e0e1e" stroke="#ff2bd6" stroke-width="5"/>
    <path d="M-48 -30 L-34 -58 L34 -58 L48 -30 Z" fill="#0e0e1e" stroke="#ff2bd6" stroke-width="5"/>
    <rect x="-62" y="-18" width="30" height="8" fill="#ff2b2b"/><rect x="32" y="-18" width="30" height="8" fill="#ff2b2b"/>
  </g>

  <!-- player car (near) -->
  <g transform="translate(600 450)" filter="url(#glow)">
    <rect x="-78" y="-6" width="18" height="26" rx="4" fill="#000"/>
    <rect x="60" y="-6" width="18" height="26" rx="4" fill="#000"/>
    <rect x="-70" y="-30" width="140" height="40" rx="14" fill="#0e0e1e" stroke="#00f0ff" stroke-width="3"/>
    <path d="M-48 -30 L-34 -58 L34 -58 L48 -30 Z" fill="#0e0e1e" stroke="#00f0ff" stroke-width="3"/>
    <rect x="-26" y="-52" width="52" height="16" rx="3" fill="#00f0ff" fill-opacity="0.25"/>
    <rect x="-62" y="-18" width="30" height="8" fill="#ff2b2b"/><rect x="32" y="-18" width="30" height="8" fill="#ff2b2b"/>
    <path d="M-20 12 L0 40 L20 12 Z" fill="#00f0ff" fill-opacity="0.8"/>
  </g>

  <!-- title -->
  <g text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900">
    <text x="600" y="108" font-size="76" fill="#00f0ff" filter="url(#glow)">TURBO COMBAT RACING</text>
    <text x="600" y="150" font-size="26" fill="#ff2bd6" letter-spacing="10" filter="url(#glow)">SPEED · COMBAT · HEAT</text>
  </g>
</svg>
